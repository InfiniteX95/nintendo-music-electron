name: Build

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                    - macos-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build packages
              run: npm run make

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                name: ${{ runner.os }}
                path: out/make/**
